<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141338">
<title>Hungry Hole</title>
<link rel="stylesheet" href="../ortak/ui.css">
<style>
  #c { touch-action: none; }
  .timer { font-size: 18px; min-width: 84px; text-align: center; }
  .timer.warn { background: #ff4757; animation: pulse .6s infinite alternate; }
  .board { display: flex; flex-direction: column; gap: 4px; width: 100%; margin: 4px 0 8px; }
  .board > div { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 12px; background: rgba(0,0,0,.25); font-size: 14px; }
  .board > div.me { background: rgba(59,130,246,.45); box-shadow: inset 0 0 0 2px rgba(255,255,255,.5); }
  .board > div.out { opacity: .55; }
  .board i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .board b { flex: 1; text-align: left; }
  .board em { font-style: normal; font-weight: 800; color: #ffe066; }
  .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .mode { border: 2px solid rgba(255,255,255,.12); border-radius: 14px; padding: 7px 4px; background: rgba(0,0,0,.25); color: #fff; cursor: pointer; display: flex; flex-direction: column; gap: 1px; font-family: inherit; }
  .mode b { font-size: 14px; } .mode small { font-size: 10px; opacity: .75; line-height: 1.15; font-weight: 600; }
  .mode.on { border-color: var(--gold); background: linear-gradient(180deg, rgba(255,200,61,.3), rgba(255,140,30,.15)); box-shadow: 0 0 14px rgba(255,200,61,.35); }
  .mode:disabled { opacity: .5; }
  .mapc-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 8px; padding-top: 6px; }
  .mapc { position: relative; border: 2px solid rgba(255,255,255,.12); border-radius: 16px; padding: 10px 8px; color: #fff; font-family: inherit; cursor: pointer; text-align: left;
    display: grid; grid-template-columns: 40px 1fr; grid-template-rows: auto auto; column-gap: 8px; align-items: center;
    background: linear-gradient(160deg, #3a3590, #241f66); box-shadow: inset 0 2px 0 rgba(255,255,255,.12), 0 4px 0 #14104a; }
  .mapc .mi { grid-row: 1 / 3; font-size: 30px; text-align: center; filter: drop-shadow(0 3px 0 rgba(0,0,0,.3)); }
  .mapc b { font-size: 15px; line-height: 1.1; } .mapc small { font-size: 11px; opacity: .75; font-weight: 700; }
  .mapc.on { border-color: var(--gold); background: linear-gradient(160deg, #6a4bd0, #3a2a9a); box-shadow: 0 0 0 2px rgba(255,200,61,.4), 0 4px 0 #14104a, 0 0 18px rgba(255,200,61,.35); }
  .mapc.locked { cursor: default; } .mapc.locked .mi, .mapc.locked b, .mapc.locked small { filter: grayscale(1) brightness(.7); opacity: .8; }
  .mapc.locked.prem { cursor: pointer; }
  .mapc.prem { border-color: rgba(255,200,61,.55); background: linear-gradient(160deg, #5a3aa0, #2b1d6e); }
  .mapc .req { position: absolute; top: -9px; right: 6px; transform: rotate(-4deg); z-index: 1; font-style: normal; font-size: 13px; font-weight: 800; white-space: nowrap;
    padding: 3px 10px; border-radius: 99px; background: rgba(10,8,30,.85); border: 2px solid rgba(255,255,255,.35); text-shadow: 0 1px 0 #000; }
  .mapc .req.buy { background: linear-gradient(180deg, #ffe27a, #f0a000); color: #5a2a00; border-color: #fff3c4; text-shadow: none; }
  .mapchip { cursor: pointer; font-family: inherit; color: #fff; } .mapchip b { color: var(--gold); }
  .mapc .x4 { position: absolute; left: 6px; top: -10px; z-index: 1; font-size: 13px; font-weight: 900; padding: 1px 9px; border-radius: 99px; color: #08381c;
    background: linear-gradient(180deg, #a8ffcf, #3be07a); border: 2px solid #fff; box-shadow: 0 2px 0 #0b5e29; transform: rotate(-5deg); }
  .diffs { display: flex; align-items: center; gap: 4px; padding: 4px; border-radius: 14px; background: rgba(0,0,0,.3); }
  .diffs > span { font-size: 12px; font-weight: 800; padding: 0 6px; opacity: .85; }
  .diff { flex: 1; border: 0; border-radius: 10px; padding: 7px 2px; font: inherit; font-size: 13px; font-weight: 800; color: #c9d6ff; background: rgba(255,255,255,.08); cursor: pointer; }
  .diff.on { color: #fff; box-shadow: 0 3px 0 rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.4); }
  .diff.on.d-easy { background: linear-gradient(180deg, #5ff59a, #149a45); } .diff.on.d-normal { background: linear-gradient(180deg, #6aa8ff, #2a5fd0); }
  .diff.on.d-hard { background: linear-gradient(180deg, #ffb35a, #d06a00); } .diff.on.d-master { background: linear-gradient(180deg, #ff6b7a, #b0102a); }
  .unlock { padding: 8px 12px; border-radius: 14px; font-weight: 700; background: linear-gradient(90deg, rgba(59,224,122,.25), rgba(34,211,238,.2)); border: 1px solid rgba(157,255,194,.5); }
</style>
</head>
<body>
<canvas id="c3d"></canvas>
<canvas id="c"></canvas>

<div class="hud">
  <div class="hud-row">
    <button class="icon-btn" id="pauseBtn">❚❚</button>
    <button class="icon-btn" id="soundBtn">🔊</button>
    <div class="lvl-chip" id="lvl">Level 1</div>
    <div class="coin-pill"><i class="coin"></i><b id="coins">0</b></div>
  </div>
  <div class="hud-row hidden" id="timerRow" style="justify-content:flex-start;margin-top:6px"><span class="pill timer" id="timer">⏱️ 90</span></div>
</div>

<div class="overlay hidden" id="ov"></div>

<script src="../ortak/economy.js"></script>
<script src="../ortak/gicons-data.js"></script>
<script src="../ortak/gicons.js"></script>
<script src="../ortak/cloud.js"></script>
<script src="../ortak/iap.js"></script>
<script src="../ortak/sound.js"></script>
<script src="../ortak/ads.js"></script>
<script src="../ortak/kit.js"></script>
<script src="../ortak/fx.js"></script>
<script src="../ortak/lib/three.min.js"></script>
<script src="models.js"></script>
<script src="render3d.js"></script>
<script src="game.js"></script>
</body>
</html>
